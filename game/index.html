<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Frost Ridge Run — a 2D canvas alpine flight game: rings, fuel, and runway landings.">
<title>Frost Ridge Run — an alpine flight game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1220; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: auto; background: #0b1220; }
  #hint {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    color: #9fb4d8; font: 12px/1.4 system-ui, sans-serif; opacity: 0.75;
    pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <noscript><p style="color:#e8f2ff;font:16px system-ui,sans-serif;text-align:center">Frost Ridge Run needs JavaScript to fly.</p></noscript>
    <div id="hint">W/S throttle &middot; Arrow keys pitch &amp; roll &middot; Space flare &middot; P pause &middot; M mute</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
